name: Fixture proposal
description: Propose a new synthetic fixture (a task, files, a good proposal, a bad proposal).
labels: ["fixture"]
body:
  - type: dropdown
    id: category
    attributes:
      label: Category
      options: [clean, off_scope, missing_evidence, prompt_injection, ambiguous, "new category (explain below)"]
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Task text
    validations:
      required: true
  - type: textarea
    id: proposals
    attributes:
      label: Good and bad proposal, and the expected verdict for each
      description: The bad proposal should be well-formed; the point is to test the reviewer, not the validator.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What gap does this fixture cover that the existing 20 do not?
    validations:
      required: true
  - type: checkboxes
    id: synthetic
    attributes:
      label: Content check
      options:
        - label: Everything here is original and synthetic. No real code, credentials, personal data, or operational attack steps.
          required: true
