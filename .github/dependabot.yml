version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    labels: [dependencies]
    # Dev-only tree today (tsx, typescript, @types/node). Group so one PR lands per week.
    groups:
      dev-dependencies:
        dependency-type: development
