<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="jev-harness: the model proposes, Jev supplies evidence, code decides, the host authorizes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f19"/>
      <stop offset="1" stop-color="#151b2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b93a7"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <text x="60" y="78" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, sans-serif" font-size="40" font-weight="700" fill="#f4f6fb">jev-harness</text>
  <text x="60" y="112" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, sans-serif" font-size="18" fill="#aab2c5">A coding harness where the model proposes, Jev supplies evidence, code decides, and the host authorizes.</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" text-anchor="middle">
    <rect x="60" y="170" width="190" height="72" rx="12" fill="#1f2740" stroke="#3a4566"/>
    <text x="155" y="200" fill="#f4f6fb" font-weight="600">LLM</text>
    <text x="155" y="224" fill="#aab2c5">proposes one edit</text>
    <line x1="250" y1="206" x2="292" y2="206" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="296" y="170" width="190" height="72" rx="12" fill="#1f2740" stroke="#3a4566"/>
    <text x="391" y="200" fill="#f4f6fb" font-weight="600">validate</text>
    <text x="391" y="224" fill="#aab2c5">schema · scope · diff</text>
    <line x1="486" y1="206" x2="528" y2="206" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="532" y="170" width="190" height="72" rx="12" fill="#26304f" stroke="#5b6cff"/>
    <text x="627" y="200" fill="#f4f6fb" font-weight="600">Jev</text>
    <text x="627" y="224" fill="#c6ccff">4 yes/no questions</text>
    <line x1="722" y1="206" x2="764" y2="206" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="768" y="170" width="190" height="72" rx="12" fill="#1f2740" stroke="#3a4566"/>
    <text x="863" y="200" fill="#f4f6fb" font-weight="600">code decides</text>
    <text x="863" y="224" fill="#aab2c5">permit · proposal_only</text>
    <line x1="958" y1="206" x2="1000" y2="206" stroke="#8b93a7" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="1004" y="170" width="136" height="72" rx="12" fill="#1f2740" stroke="#3a4566"/>
    <text x="1072" y="200" fill="#f4f6fb" font-weight="600">receipt</text>
    <text x="1072" y="224" fill="#aab2c5">nothing runs</text>
  </g>
  <text x="60" y="286" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, sans-serif" font-size="14" fill="#7d869c">Verdicts are evidence, not permission. Jev unavailable is never “safe”. Pinned to jev-1.13.0.</text>
</svg>
